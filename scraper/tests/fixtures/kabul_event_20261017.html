<script>
document.addEventListener('DOMContentLoaded',function(){
  try{if(sessionStorage.getItem('kabul-beta-dismissed'))return;}catch(e){}
  if(document.getElementById('kabul-beta-banner'))return;
  var banner=document.createElement('aside');
  banner.id='kabul-beta-banner';
  banner.setAttribute('aria-label','Nieuwe website');
  banner.innerHTML='<span>✨ We krijgen een nieuwe website! <a href="https://beta.kabulagogo.nl">Kom je &#39;m alvast proberen?</a></span><button type="button" aria-label="Banner sluiten">&times;</button>';
  document.body.prepend(banner);
  var navs=Array.from(document.querySelectorAll('.w-nav'));
  var originals=navs.map(function(nav){return nav.style.top;});
  function resize(){
    var height=banner.getBoundingClientRect().height;
    document.documentElement.style.setProperty('--kabul-beta-height',height+'px');
    navs.forEach(function(nav,i){
      nav.style.top=originals[i];
      var style=getComputedStyle(nav);
      if(style.position==='fixed'&&style.top!=='auto')nav.style.top='calc('+style.top+' + '+height+'px)';
    });
  }
  var observer=new ResizeObserver(resize);observer.observe(banner);resize();
  banner.querySelector('button').addEventListener('click',function(){
    observer.disconnect();banner.remove();
    document.documentElement.style.removeProperty('--kabul-beta-height');
    navs.forEach(function(nav,i){nav.style.top=originals[i];});
    try{sessionStorage.setItem('kabul-beta-dismissed','1');}catch(e){}
  });
});
</script>

spek<br>01:00 – 03:00 Gaard<br>03:00 – 05:00 djay_worm</p><h5>ABU</h5><p>23:00 – 23:35 Keukengerei (live)<br>00:15 – 01:00 Onkruid (live)<br>02:00 – 03:00 Goodnight Mars (live)</p></div></div></div><div class="richtext-regular w-richtext"><p>Community Night is KABULs nacht-experiment tussen club en live, gemaakt met de community.</p><p>In ABU staan live-acts dichtbij, terwijl opkomend dj-talent Teatro overneemt. De volledige line-up volgt. Kom vroeg, dwaal tussen de zalen en ontdek nieuw geluid van dichtbij.</p><h5>INFO</h5><p>Zaterdag 17 oktober 2026<br>22:00–05:00<br>ABU + Teatro</p><p>Onze deuren sluiten drie uur voor het einde van het event. Het is niet mogelijk om opnieuw naar binnen te gaan nadat je het gebouw hebt verlaten.</p><h5>CLUBWAARDEN &amp; DEURBELEID</h5><p>Zorg dat je op de hoogte bent van onze clubwaarden. Meer informatie vind je op <a href="https://www.kabulagogo.nl/policy">kabulagogo.nl/policy</a>.</p><h5>KLUISJES</h5><p>Er zijn lockers beschikbaar op locatie. Laat grote spullen en tassen alsjeblieft thuis en deel een kluisje waar mogelijk.</p><h5>VERVOER</h5><p>Kom bij voorkeur met de fiets of het openbaar vervoer. Er is geen parkeerplaats voor auto’s op ons terrein. Fietsen kunnen aan de linkerkant van het gebouw worden geparkeerd. Parkeer niet aan de overkant van de straat en houd rekening met onze buren.</p><h5>TOEGANKELIJKHEID</h5><p>Clubzaal ABU is alleen bereikbaar via een trap; er is geen lift.</p></div><div class="embed_tickets w-condition-invisible w-embed w-script"><div id="shop-frame" data-url="" style="margin:0 auto;"></div>
